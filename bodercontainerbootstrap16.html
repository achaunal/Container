<!DOCTYPE html>
<html>
    <head>
        <title>Border and Containers</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    </head>
    <body>
        <div class="container bg-secondary border-warning 5px solid black">
            <h1>Codingal</h1>
            <p>Making kids fall in love with coding</p>
        </div>
        <div class="container bg-primary border 5px solid black text-white">
            <h1>Codingal</h1>
            <p>Making kids fall in love with coding</p>
        </div>
        <div class="container p-3 bg-danger text-white">
            <h1>Codingal</h1>
            <p>Making kids fall in love with coding</p>
        </div>
        <div class="container p-3000 mb-3000 bg-warning text-white">
            <h1>Codingal</h1>
            <p>Making kids fall in love with coding</p>
        </div>
    </body>
</html>
